name: V2.1.3 UAT Verification

on:
  push:
    branches: [v2.1.3-life-plan-uat]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tested branch
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run complete test suite
        run: npm test

      - name: Verify V1 production blobs
        shell: bash
        run: |
          test "$(git hash-object index.html)" = "a9efc9885cf12df1f655e3411e1ed7ca107a6055"
          test "$(git hash-object styles.css)" = "c3538d4ec0bfa3f66e949ef5705128e94b47f8f6"
          test "$(git hash-object app.js)" = "0d198d9d7226ad400d7a2a365877cbcfc9b1b714"

      - name: Syntax-check production modules
        shell: bash
        run: find js/v2 v2 -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Verify synchronized V2 assets
        shell: bash
        run: |
          grep -Fq './app.css?v=2.1.9' v2/index.html
          grep -Fq './app.js?v=2.1.9' v2/index.html

      - name: Smoke V2 through HTTP
        shell: bash
        run: |
          python3 -m http.server 4173 > /tmp/v213-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/v2/ > /tmp/v213-index.html; then
              break
            fi
            sleep 0.25
          done
          grep -Fq './app.css?v=2.1.9' /tmp/v213-index.html
          grep -Fq './app.js?v=2.1.9' /tmp/v213-index.html
          curl --fail --silent --show-error http://127.0.0.1:4173/v2/app.css > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/v2/app.js > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/js/v2/templates/life-plan.js > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/js/v2/ui/life-story.js > /dev/null
